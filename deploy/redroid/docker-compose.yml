services:
  redroid:
    image: ${REDROID_IMAGE:-redroid/redroid:14.0.0-latest}
    container_name: googletv-redroid
    privileged: true
    restart: unless-stopped
    shm_size: 1gb
    command:
      - androidboot.redroid_width=${REDROID_WIDTH:-1920}
      - androidboot.redroid_height=${REDROID_HEIGHT:-1080}
      - androidboot.redroid_dpi=${REDROID_DPI:-240}
    volumes:
      - redroid-data:/data
    expose:
      - "5555"
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      - android-private

  gateway:
    build:
      context: ../../server/gateway
    container_name: googletv-gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Set GATEWAY_TOKEN in deploy/redroid/.env}
      ANDROID_ADB_HOST: redroid
      ANDROID_ADB_PORT: "5555"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
    depends_on:
      - redroid
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - android-private

volumes:
  redroid-data:

networks:
  android-private:
    name: googletv-android-private
    driver: bridge
