name: CI
on:
  push:
    branches: [main, redroid-migration]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: node --check server/gateway/src/server.js
      - run: npm test
      - run: npm run build
      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: npm run test:browser
      - name: Check Redroid host preflight script syntax
        run: bash -n scripts/redroid-host-preflight.sh
      - name: Validate Redroid Compose configuration
        run: docker compose --env-file deploy/redroid/.env.example -f deploy/redroid/docker-compose.yml config --quiet
