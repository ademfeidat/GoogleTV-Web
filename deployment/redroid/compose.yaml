services:
  android:
    image: redroid/redroid:${REDROID_TAG:-16.0.0-latest}
    container_name: googletv-redroid
    privileged: true
    restart: unless-stopped
    # Keep ADB loopback-only. Never publish this port directly to the public internet.
    ports:
      - "127.0.0.1:${REDROID_ADB_PORT:-5555}:5555"
    volumes:
      - redroid-data:/data
    command:
      - androidboot.redroid_width=${REDROID_WIDTH:-1920}
      - androidboot.redroid_height=${REDROID_HEIGHT:-1080}
      - androidboot.redroid_dpi=${REDROID_DPI:-240}
    stop_grace_period: 30s

volumes:
  redroid-data:
    name: googletv-redroid-data
