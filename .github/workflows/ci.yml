name: CI
on:
  push:
    branches: [main, redroid-migration]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: node --check server/gateway/src/server.js
      - run: npm test
      - name: Test Python Redroid diagnostics\n        run: |\n          python3 -m py_compile scripts/redroid_doctor.py test/test_redroid_doctor.py\n          python3 -m unittest discover -s test -p 'test_*.py'\n      - run: npm run build
      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: npm run test:browser
      - name: Check Redroid host and data scripts
        run: |
          bash -n scripts/redroid-host-preflight.sh
          bash -n scripts/redroid-runtime-check.sh
          bash -n scripts/redroid-data.sh
          bash scripts/redroid-data.sh --help
      - name: Validate Redroid Compose configuration
        run: docker compose --env-file deploy/redroid/.env.example -f deploy/redroid/docker-compose.yml config --quiet
